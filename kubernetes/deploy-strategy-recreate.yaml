apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mahmoud
  name: mahmoud
spec:
  replicas: 10
  selector:
    matchLabels:
      app: mahmoud
  template:
    metadata:
      labels:
        app: mahmoud
    spec:
      containers:
        - image: httpd:alpine3.18
          name: httpd
  strategy:
    type: Recreate

